[project]
name = "stil-lint"
version = "0.1.0"
description = "Stil- og kvalitetslinter for norsk (og engelsk) tekst, med Jev som skjønnslag. MCP-server."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
stat = ["spacy>=3.7"]
pptx = ["python-pptx>=1.0"]
dev = ["pytest>=8", "python-pptx>=1.0"]

[project.scripts]
stil-lint = "stillint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stillint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
